version: '3.8'

services:
  tienda:
    build: .
    container_name: ecommerce_tienda
    ports:
      - "8501:8501"
    volumes:
      - ./.streamlit:/app/.streamlit
    command: streamlit run src/app_cliente.py
    restart: unless-stopped

  admin:
    build: .
    container_name: ecommerce_admin
    ports:
      - "8502:8501" # Mapeamos el puerto 8501 interno al 8502 externo
    volumes:
      - ./.streamlit:/app/.streamlit
    command: streamlit run src/app_admin.py --server.port 8501
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: ecommerce_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Lima
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
